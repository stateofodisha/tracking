<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State of Odisha — Govt Project Tracker</title>
<meta name="description" content="Tracking government-announced projects across Odisha — status, timelines, and days pending, in one place.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="view-cards">

<div class="bg-layer">
  <div class="bg-wheel"><img src="assets/wheel.svg" alt=""></div>
</div>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <img class="wheel-mark" src="assets/wheel.svg" alt="">
      <h1>State of Odisha<span>Govt. Project Tracker</span></h1>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark / light theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <section class="stat-strip">
    <div class="stat-chip"><div class="n" id="statTotal">0</div><div class="l">Projects Tracked</div></div>
    <div class="stat-chip red"><div class="n" id="statStuck">0</div><div class="l">Stuck / Delayed</div></div>
    <div class="stat-chip"><div class="n" id="statProgress">0</div><div class="l">In Progress</div></div>
    <div class="stat-chip"><div class="n" id="statCompleted">0</div><div class="l">Completed</div></div>
  </section>

  <section class="controls">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search projects, locations, categories…">
    </div>
    <select class="status-filter" id="statusFilter">
      <option value="all">All statuses</option>
      <option value="stuck">Stuck / Delayed</option>
      <option value="progress">In Progress</option>
      <option value="completed">Completed</option>
      <option value="review">Under Review</option>
    </select>
    <div class="view-switch">
      <button data-view="cards" class="active" aria-label="Card view">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Cards
      </button>
      <button data-view="large" aria-label="Large card view">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18" rx="1.5"/><rect x="13" y="3" width="8" height="18" rx="1.5"/></svg>
        Large
      </button>
      <button data-view="list" aria-label="List view">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        List
      </button>
      <button data-view="gallery" aria-label="Gallery view">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="1.5"/><path d="M3 14l5-5 4 4 4-4 5 5"/></svg>
        Gallery
      </button>
      <button data-view="carousel" aria-label="Carousel view">
        <svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="1.5"/><path d="M2 8v8M22 8v8"/></svg>
        Carousel
      </button>
    </div>
  </section>

  <div class="carousel-nav">
    <button id="carPrev" aria-label="Scroll left"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="carNext" aria-label="Scroll right"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <main id="grid"></main>

</div>

<footer class="site-foot">
  <div class="wheel-spin"><img src="assets/wheel.svg" alt=""></div>
  Independent public tracker of Odisha government project announcements.<br>
  Not an official Government of Odisha property. Data compiled from public statements &amp; news.
</footer>

<script src="assets/data.js"></script>
<script src="assets/script.js"></script>
</body>
</html>
